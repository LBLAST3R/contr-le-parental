<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f6cbd" />
  <title>Guardian — Connexion</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <section class="login">
    <form class="login-card" method="post" action="/login" autocomplete="on">
      <div class="brand">
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="gLogin" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#2a86d8" /><stop offset="1" stop-color="#0f5aa6" />
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="15" fill="url(#gLogin)" />
          <rect width="64" height="30" rx="15" fill="#ffffff" opacity="0.07" />
          <path d="M32 12 L48 17 V31.5 C48 41.7 41.2 48.8 32 53 C22.8 48.8 16 41.7 16 31.5 V17 Z" fill="#ffffff" />
          <path d="M32 42.5 C32 42.5 21 35.6 21 28.9 C21 25.7 23.5 23.1 26.6 23.1 C28.7 23.1 30.7 24.3 32 26.2 C33.3 24.3 35.3 23.1 37.4 23.1 C40.5 23.1 43 25.7 43 28.9 C43 35.6 32 42.5 32 42.5 Z" fill="#0f6cbd" />
        </svg>
        <span class="wordmark">Guardian<small>Contrôle parental</small></span>
      </div>

      <p class="lead">Espace réservé aux parents. Entrez le mot de passe pour accéder au tableau de bord.</p>

      <label for="password">Mot de passe</label>
      <input id="password" type="password" name="password" placeholder="••••••••"
             autocomplete="current-password" autofocus required />

      <button class="btn-primary" type="submit">Se connecter</button>
      <p class="error hidden" id="err">Mot de passe incorrect.</p>

      <p class="note">Cet appareil restera connecté&nbsp;: vous n'aurez pas à retaper
        le mot de passe à chaque visite. Déconnectez-vous sur un appareil partagé.</p>
    </form>
  </section>
  <script src="/static/login.js"></script>
</body>
</html>
