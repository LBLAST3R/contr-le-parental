<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>Guardian — connexion</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <section class="login">
    <form class="login-card" method="post" action="/login" autocomplete="on">
      <div class="brand"><span class="brand-mark"></span> Guardian</div>
      <p class="muted">Espace parents. Entre le mot de passe pour accéder au tableau de bord.</p>
      <input type="password" name="password" placeholder="Mot de passe"
             autocomplete="current-password" autofocus required />
      <button class="btn btn-primary" type="submit">Entrer</button>
      <p class="error hidden" id="err">Mot de passe incorrect.</p>
      <p class="muted" style="font-size:.78rem; margin-top:1rem">
        Tu resteras connecté sur cet appareil — pas besoin de retaper le mot de passe à chaque fois.
      </p>
    </form>
  </section>
  <script src="/static/login.js"></script>
</body>
</html>
