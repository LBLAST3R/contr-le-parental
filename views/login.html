<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4652c9" />
  <title>Guardian — Connexion</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <section class="login">
    <form class="login-card" method="post" action="/login" autocomplete="on">
      <div class="brand">
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="14" fill="#4652c9" />
          <path d="M32 14 44 19 V33 C44 41 39 46.5 32 49.5 C25 46.5 20 41 20 33 V19 Z" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" />
          <path d="M26 32.5 L30.5 37 L39 27.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="wordmark">Guardian<small>Contrôle parental</small></span>
      </div>

      <p class="lead">Espace réservé aux parents. Entrez le mot de passe pour accéder au tableau de bord.</p>

      <label for="password">Mot de passe</label>
      <input id="password" type="password" name="password" placeholder="••••••••"
             autocomplete="current-password" autofocus required />

      <button class="btn-primary" type="submit">Se connecter</button>
      <p class="error hidden" id="err">Mot de passe incorrect.</p>

      <p class="note">Cet appareil restera connecté&nbsp;: vous n'aurez pas à retaper
        le mot de passe à chaque visite. Déconnectez-vous sur un appareil partagé.</p>
    </form>
  </section>
  <script src="/static/login.js"></script>
</body>
</html>
